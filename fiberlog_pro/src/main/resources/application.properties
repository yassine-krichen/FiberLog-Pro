# Application Name
spring.application.name=fiberlog_pro

# Server Configuration
server.port=8080

# Datasource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/fiberlog_pro
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration (if needed)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging (optional: adjust as needed)
# Set the root logger level to INFO (reduces verbosity)
logging.level.root=INFO

# Control Spring framework logging
logging.level.org.springframework=INFO

# Control Hibernate logging (often too verbose)
logging.level.org.hibernate=ERROR

# If you want to see only minimal logs from your database interactions:
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR

# Expose specific endpoints (health, info, metrics, logfile, etc.)
management.endpoints.web.exposure.include=health,info,metrics,logfile

# (Optional) Customize the base path for Actuator endpoints
management.endpoints.web.base-path=/actuator

# Security (if needed)
# management.endpoints.web.exposure.exclude=env,beans,configprops (etc.)

